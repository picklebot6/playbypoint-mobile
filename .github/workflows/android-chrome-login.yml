name: Android Chrome Login Test

on:
  workflow_dispatch:

jobs:
  android-chrome-login:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Check KVM
        run: |
          ls -l /dev/kvm
          groups

      - name: Start Android emulator and run test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-desktop
          arch: x86_64
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader
          script: |
            echo "Setting Android display to Medium Desktop dimensions..."
            adb shell wm size 3840x2160
            adb shell wm density 320

            echo "Android display configuration:"
            adb shell wm size
            adb shell wm density

            npx appium driver list --installed

            npx appium --allow-insecure uiautomator2:chromedriver_autodownload > appium.log 2>&1 &

            sleep 5

            if [ -z "$PLAYBYPOINT_EMAIL" ]; then
              echo "PLAYBYPOINT_EMAIL is missing"
              exit 1
            fi

            if [ -z "$PLAYBYPOINT_PASSWORD" ]; then
              echo "PLAYBYPOINT_PASSWORD is missing"
              exit 1
            fi

            echo "Credentials are available."

            npx tsx scripts/android-chrome-login.ts
        env:
          PLAYBYPOINT_EMAIL: ${{ secrets.PLAYBYPOINT_EMAIL }}
          PLAYBYPOINT_PASSWORD: ${{ secrets.PLAYBYPOINT_PASSWORD }}

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-chrome-login
          path: |
            post-login.png
            appium.log