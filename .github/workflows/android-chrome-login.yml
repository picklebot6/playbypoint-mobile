name: Android Chrome Login Test

on:
  workflow_dispatch:

jobs:
  android-chrome-login:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Check KVM
        run: |
          ls -l /dev/kvm
          groups

      - name: Start Android emulator and run test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-desktop
          arch: x86_64
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader
          script: |
            echo "Setting Android display size..."
            adb shell wm size 3840x2160
            adb shell wm density 320

            echo "Android display configuration:"
            adb shell wm size
            adb shell wm density

            echo "Appium drivers:"
            npx appium driver list --installed

            npx appium --allow-insecure uiautomator2:chromedriver_autodownload > appium.log 2>&1 &

            sleep 5

            test -n "$PLAYBYPOINT_EMAIL" || (echo "PLAYBYPOINT_EMAIL is missing"; exit 1)
            test -n "$PLAYBYPOINT_PASSWORD" || (echo "PLAYBYPOINT_PASSWORD is missing"; exit 1)

            echo "Credentials are available."

            npx tsx scripts/android-chrome-login.ts

        env:
          PLAYBYPOINT_EMAIL: ${{ secrets.PLAYBYPOINT_EMAIL }}
          PLAYBYPOINT_PASSWORD: ${{ secrets.PLAYBYPOINT_PASSWORD }}

      - name: Upload screenshot
        if: always()
        id: upload-screenshot
        uses: actions/upload-artifact@v7
        with:
          path: post-login.png
          archive: false
          if-no-files-found: warn

      - name: Show screenshot in summary
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.upload-screenshot.outputs.artifact-id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$ARTIFACT_ID" ]; then
            echo "No screenshot artifact was created." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BLOB_URL=$(curl -Ls \
            -o /dev/null \
            -w '%{url_effective}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip")

          echo "## Post-login Screenshot" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "![Post-login screenshot](${BLOB_URL})" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Appium log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-chrome-login-logs
          path: appium.log
          if-no-files-found: warn