name: Android Chrome Main Workflow

on:
  workflow_dispatch:

jobs:
  android-chrome-main:
    runs-on: ubuntu-22.04

    env:
      PLAYBYPOINT_EMAIL: ${{ secrets.PLAYBYPOINT_EMAIL }}
      PLAYBYPOINT_PASSWORD: ${{ secrets.PLAYBYPOINT_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Check KVM
        run: |
          ls -l /dev/kvm
          groups

      - name: Start Android emulator and run main workflow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-desktop
          arch: x86_64
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader
          script: |
            adb shell wm user-rotation lock 1

            npx appium driver list --installed

            npx appium --allow-insecure uiautomator2:chromedriver_autodownload > appium.log 2>&1 &

            sleep 5

            printf '\n' | npx tsx src/browser/main.ts 2>&1 | tee main-workflow.log

      - name: Upload booking screenshot
        if: always()
        id: upload-screenshot
        uses: actions/upload-artifact@v7
        with:
          path: final-workflow.png
          archive: false
          if-no-files-found: warn

      - name: Show screenshot in summary
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.upload-screenshot.outputs.artifact-id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$ARTIFACT_ID" ]; then
            echo "No screenshot artifact was created." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BLOB_URL=$(curl -Ls \
            -o /dev/null \
            -w '%{url_effective}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip")

          echo "## Booking Workflow Screenshot" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "![Booking workflow screenshot](${BLOB_URL})" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload workflow logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-chrome-main-logs
          path: |
            appium.log
            main-workflow.log
          if-no-files-found: warn